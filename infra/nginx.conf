# /etc/nginx/sites-available/schoolapp.conf   (Revision 6)
# Symlink: ln -s /etc/nginx/sites-available/schoolapp.conf /etc/nginx/sites-enabled/
#
# ROLE OF NGINX IN R6
#   Caddy is the public edge (ports 80/443, all TLS certificates).
#   Nginx listens ONLY on 127.0.0.1:8080 (plain HTTP) and serves:
#     - the React SPA build for EVERY host (platform subdomains + custom domains)
#     - /api  -> Laravel via PHP-FPM (FastCGI 127.0.0.1:9000, app in /var/www/api)
#   Install first:  cp infra/laravel-fastcgi.conf /etc/nginx/snippets/laravel-fastcgi.conf
#   Nginx never handles certificates. Do not add "listen 443" here.
#   See infra/Caddyfile and docs/modules/custom-domain.md
#
# Add to the http {} block of /etc/nginx/nginx.conf:
#   limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;                      # every host: *.schoolapp.com AND custom domains

    # REQUIRED: restore the real client IP from Caddy. Without these two lines every
    # request looks like 127.0.0.1 and the /api/internal/ allow-list below is useless.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    # Security Headers (HSTS is sent by Caddy)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_comp_level 6;

    client_max_body_size 10M;
    client_body_timeout 30s;

    # React SPA (same build for every tenant; tenant is resolved from Host at runtime)
    root /var/www/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Public website (docs/modules/public-website.md): these exact paths are answered by Laravel (routes/public.php)
    # so <title>/meta/robots/sitemap are institution-specific. NO rewrite: Laravel routes on the original REQUEST_URI.
    # Everything else (/login, /admin/..., assets) keeps falling through to the SPA below.
    location = /            { include /etc/nginx/snippets/laravel-fastcgi.conf; }
    location = /notices     { include /etc/nginx/snippets/laravel-fastcgi.conf; }
    location = /admission   { include /etc/nginx/snippets/laravel-fastcgi.conf; }
    location = /privacy     { include /etc/nginx/snippets/laravel-fastcgi.conf; }
    location = /terms       { include /etc/nginx/snippets/laravel-fastcgi.conf; }
    location = /robots.txt  { include /etc/nginx/snippets/laravel-fastcgi.conf; }
    location = /sitemap.xml { include /etc/nginx/snippets/laravel-fastcgi.conf; }

    location ~* \.(js|css|png|jpg|jpeg|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # Rate limiting for login (must be declared before the generic /api block)
    location /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/laravel-fastcgi.conf;
        fastcgi_read_timeout 60s;
    }

    # Internal endpoints (Caddy on-demand TLS "ask") — loopback only
    location /api/internal/ {
        allow 127.0.0.1;
        # allow 172.16.0.0/12;      # docker-compose only: Caddy reaches Nginx from the compose network (also set INTERNAL_IPS)
        deny all;
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    # Laravel API — same origin as the SPA, so no CORS is needed
    location /api {
        # The Host header reaches PHP unchanged (HTTP_HOST) - the tenant is resolved from it
        include /etc/nginx/snippets/laravel-fastcgi.conf;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_connect_timeout 10s;
    }

    location ~ /\.(env|git|htaccess) { deny all; return 404; }
    location ~ /(vendor|storage/logs|bootstrap/cache) { deny all; return 403; }

    access_log /var/log/nginx/schoolapp_access.log;
    error_log  /var/log/nginx/schoolapp_error.log warn;
}
