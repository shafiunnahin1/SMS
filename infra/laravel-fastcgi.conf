# /etc/nginx/snippets/laravel-fastcgi.conf   (Revision 6.2)
# Shared by every location that hands a request to Laravel. Single source of truth for the FastCGI wiring.
include fastcgi_params;                                  # REQUEST_URI = ORIGINAL request URI (do not rewrite - Laravel routes on it)
fastcgi_pass 127.0.0.1:9000;                             # PHP-FPM speaks FastCGI, NOT HTTP - never proxy_pass to :9000
fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
fastcgi_param SCRIPT_NAME     /index.php;
fastcgi_param DOCUMENT_ROOT   /var/www/api/public;
fastcgi_param HTTPS           on;                        # TLS is terminated by Caddy
fastcgi_param REMOTE_ADDR     $remote_addr;              # real client IP, restored by set_real_ip_from in nginx.conf
